<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Düz Okey</title>
<style>
  :root {
    --felt: #0f3b2e; --felt2: #14503e; --wood: #5a3a22; --wood2: #3f2615; --ivory: #f6efdc;
    --gold: #e0b252; --tw: 46px; --th: 64px;
    --c0: #c98a00; --c1: #1f4fd6; --c2: #15151a; --c3: #cf2a2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a2a20; color: var(--ivory); font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
  button { font: inherit; cursor: pointer; }
  #login { min-height: 100%; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #17614b, #082219 70%); }
  #login form { background: rgba(0,0,0,.35); padding: 34px 38px; border: 1px solid #ffffff22; border-radius: 10px; width: min(360px, 92vw); display: grid; gap: 14px; }
  #login h1 { margin: 0 0 4px; font-family: Georgia, serif; font-size: 34px; color: var(--gold); letter-spacing: .5px; }
  #login p { margin: 0 0 6px; opacity: .75; font-size: 14px; }
  #login input { padding: 12px; border-radius: 6px; border: 1px solid #ffffff33; background: #0006; color: #fff; font-size: 16px; }
  #login button { padding: 12px; border: 0; border-radius: 6px; background: var(--gold); color: #2a1a05; font-weight: 700; font-size: 16px; }
  #err { color: #ff9a8a; min-height: 18px; font-size: 14px; }
  #game { display: none; height: 100%; grid-template-rows: auto 1fr auto; background: radial-gradient(ellipse at 50% 45%, var(--felt2), var(--felt) 70%, #08241b); }
  #top { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: #0006; gap: 12px; flex-wrap: wrap; }
  #status { font-size: 17px; font-weight: 700; color: var(--gold); }
  #scoreboard { font-size: 14px; opacity: .9; }
  #log { font-size: 12px; opacity: .65; max-width: 34ch; text-align: right; line-height: 1.3; }
  #table { position: relative; display: grid; grid-template-columns: 1fr minmax(0, 560px) 1fr; grid-template-rows: auto 1fr; padding: 8px; gap: 6px; min-height: 0; }
  .seatbox { text-align: center; font-size: 14px; padding: 6px 10px; align-self: start; justify-self: center; border-radius: 8px; border: 1px solid transparent; }
  .seatbox.turn { border-color: var(--gold); box-shadow: 0 0 14px #e0b25288; }
  .seatbox .nm { font-weight: 700; }
  .seatbox .tm { font-size: 12px; opacity: .7; }
  .backs { display: flex; gap: 2px; justify-content: center; margin-top: 4px; flex-wrap: wrap; max-width: 260px; }
  .backs i { width: 10px; height: 16px; background: linear-gradient(#e9dfc4, #cdbf98); border-radius: 2px; box-shadow: 0 1px 0 #0006; }
  #seatTop { grid-column: 2; grid-row: 1; }
  #seatLeft { grid-column: 1; grid-row: 2; align-self: center; }
  #seatRight { grid-column: 3; grid-row: 2; align-self: center; }
  #center { grid-column: 2; grid-row: 2; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 8px; align-items: center; justify-items: center; min-height: 0; }
  .dz { width: calc(var(--tw) + 26px); height: calc(var(--th) + 26px); border: 2px dashed #ffffff33; border-radius: 10px; display: grid; place-items: center; text-align: center; font-size: 12px; position: relative; color: #ffffffaa; transition: background .15s, border-color .15s; }
  .dz small { position: absolute; bottom: 3px; left: 0; right: 0; font-size: 11px; opacity: .8; }
  .dz.over { background: #e0b25233; border-color: var(--gold); }
  .dz.live { border-color: var(--gold); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 14px #e0b252aa; } }
  #dzTop { grid-column: 2; grid-row: 1; } #dzLeft { grid-column: 1; grid-row: 2; } #dzRight { grid-column: 3; grid-row: 2; } #dzMe { grid-column: 3; grid-row: 3; }
  #mid { grid-column: 2; grid-row: 2; display: flex; gap: 16px; align-items: center; }
  #finish { grid-column: 1; grid-row: 3; width: calc(var(--tw) * 2.6); border-color: #7be0a0aa; color: #7be0a0; }
  #finish.live { border-color: #7be0a0; }
  #deck { position: relative; width: var(--tw); height: var(--th); cursor: pointer; }
  #deck .stack { position: absolute; inset: 0; border-radius: 6px; background: linear-gradient(135deg, #f1e7c9, #cfc19a); box-shadow: 2px 2px 0 #b9ab82, 4px 4px 0 #a89a72, 6px 6px 8px #0008; }
  #deck.live .stack { outline: 3px solid var(--gold); }
  #deck span { position: absolute; inset: 0; display: grid; place-items: center; color: #5a4a20; font-weight: 700; font-size: 18px; }
  #info { display: grid; gap: 4px; justify-items: center; font-size: 12px; opacity: .95; }
  .tile { width: var(--tw); height: var(--th); background: linear-gradient(#fffaf0, var(--ivory)); border-radius: 6px; box-shadow: 0 2px 0 #b6a679, 0 3px 6px #0006; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Georgia, serif; font-weight: 700; user-select: none; position: relative; }
  .tile b { font-size: calc(var(--tw) * .56); line-height: 1; }
  .tile span { font-size: calc(var(--tw) * .26); line-height: 1; margin-top: 2px; }
  .tile.okey::after { content: "★"; position: absolute; top: 1px; right: 3px; font-size: 11px; color: #b8860b; }
  .tile.fake b { font-size: calc(var(--tw) * .5); color: #6b4fb0; }
  .tile.fake small { font-size: 8px; color: #6b4fb0; }
  .tile.fresh { outline: 3px solid var(--gold); }
  .tile { touch-action: none; cursor: grab; }
  .tile.dragging { opacity: .4; }
  #bottom { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 8px 14px 14px; background: linear-gradient(#0000, #0007); }
  .sidebtn { padding: 14px 18px; border: 0; border-radius: 8px; font-weight: 700; color: #2a1a05; background: linear-gradient(#ecc671, #c99a3a); box-shadow: 0 3px 0 #8a6820; }
  .sidebtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #8a6820; }
  #rackwrap { overflow-x: auto; padding-bottom: 4px; }
  #rack { display: grid; grid-template-columns: repeat(var(--cols, 15), calc(var(--tw) + 6px)); grid-auto-rows: calc(var(--th) + 12px); gap: 2px; padding: 10px 14px 14px; background: linear-gradient(var(--wood), var(--wood2)); border-radius: 10px; box-shadow: inset 0 3px 8px #0009, 0 4px 0 #24150a, 0 8px 18px #000a; width: max-content; margin: 0 auto; }
  .slot { display: grid; place-items: center; border-radius: 6px; background: #00000026; }
  .slot.over { background: #e0b25255; }
  #toast { position: fixed; left: 50%; bottom: 190px; transform: translateX(-50%); background: #000c; padding: 8px 16px; border-radius: 20px; display: none; z-index: 5; }
  #overlay { position: fixed; inset: 0; background: #000a; display: none; place-items: center; z-index: 10; }
  #overlay .box { background: #123d2f; border: 1px solid var(--gold); border-radius: 12px; padding: 24px 28px; max-width: min(92vw, 760px); text-align: center; }
  #overlay h2 { margin: 0 0 10px; font-family: Georgia, serif; color: var(--gold); }
  #overlay .hand { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 14px 0; }
  #overlay .grp { display: flex; gap: 2px; --tw: 34px; --th: 48px; }
  #overlay .grp.fin { outline: 2px solid #7be0a0; border-radius: 6px; padding: 2px; }
  #overlay button { padding: 12px 22px; border: 0; border-radius: 8px; background: var(--gold); font-weight: 700; color: #2a1a05; }
  #wait { position: fixed; inset: 0; display: none; place-items: center; background: #000b; z-index: 9; font-size: 20px; text-align: center; padding: 20px; }
  body.narrow #log { display: none; }
  body.narrow .dz small { display: none; }
  .dz { line-height: 1.2; }
  body.narrow #game { height: auto; min-height: 100%; }
  body.narrow #table { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: auto auto; }
  body.narrow #seatLeft { grid-column: 1; grid-row: 1; align-self: start; }
  body.narrow #seatTop { grid-column: 2; grid-row: 1; }
  body.narrow #seatRight { grid-column: 3; grid-row: 1; align-self: start; }
  body.narrow #center { grid-column: 1 / -1; grid-row: 2; }
  body.narrow .backs { display: none; }
  body.narrow .seatbox { font-size: 12px; padding: 4px; }
  body.narrow #bottom { grid-template-columns: 1fr 1fr; padding: 6px 8px 14px; gap: 8px; }
  body.narrow #rackwrap { grid-column: 1 / -1; grid-row: 2; }
  body.narrow #rack { padding: 8px 6px 10px; gap: 1px; }
  body.narrow .sidebtn { padding: 10px; }
  body.narrow #toast { bottom: 230px; }
  .ghost { position: fixed; pointer-events: none; z-index: 50; opacity: .92; transform: translate(-50%, -50%) scale(1.12); }
</style>
</head>
<body>
<div id="login">
  <form id="lf" autocomplete="off">
    <h1>Düz Okey</h1>
    <p>Eşli oyun: iki gerçek oyuncu, iki bot.</p>
    <input id="u" placeholder="Kullanıcı adı" autocomplete="username" required>
    <input id="p" type="password" placeholder="Şifre" autocomplete="current-password" required>
    <div id="err"></div>
    <button type="submit">Masaya otur</button>
  </form>
</div>

<div id="game">
  <div id="top">
    <div id="status">...</div>
    <div id="scoreboard"></div>
    <div id="log"></div>
  </div>
  <div id="table">
    <div class="seatbox" id="seatTop"></div>
    <div class="seatbox" id="seatLeft"></div>
    <div class="seatbox" id="seatRight"></div>
    <div id="center">
      <div class="dz" id="dzTop"></div>
      <div class="dz" id="dzLeft"></div>
      <div id="mid">
        <div id="deck"><div class="stack"></div><span id="deckN">0</span></div>
        <div id="info"><div id="gos"></div><div id="okeyLbl"></div></div>
      </div>
      <div class="dz" id="dzRight"></div>
      <div class="dz" id="finish">Bitir<small>taşı buraya sürükle</small></div>
      <div class="dz" id="dzMe">At<small>taşı buraya sürükle</small></div>
    </div>
  </div>
  <div id="bottom">
    <button class="sidebtn" id="btnCift">Çift diz</button>
    <div id="rackwrap"><div id="rack"></div></div>
    <button class="sidebtn" id="btnSeri">Seri diz</button>
  </div>
</div>
<div id="toast"></div>
<div id="wait">Partner bekleniyor...<br>(kolpacı girişi yapınca oyun başlar)</div>
<div id="overlay"><div class="box" id="obox"></div></div>

<script src="okey-core.js"></script>
<script>
(() => {
  const C = OkeyCore;
  const COL = ['var(--c0)', 'var(--c1)', 'var(--c2)', 'var(--c3)'];
  const $ = id => document.getElementById(id);
  let ws, S = null, me = null, slots = Array(30).fill(null), slotGid = null, pendingSlot = null, drag = null, ROW = 15;
  const SLOTS = 30;

  /* ---- bağlantı ---- */
  function connect(cb) {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    ws.onopen = cb;
    ws.onmessage = e => handle(JSON.parse(e.data));
    ws.onclose = () => { toast('Bağlantı koptu, yeniden bağlanılıyor...'); setTimeout(() => { if (me !== null) reconnect(); }, 1500); };
  }
  let cred = null;
  function reconnect() { connect(() => ws.send(JSON.stringify({ t: 'login', u: cred.u, p: cred.p }))); }
  $('lf').onsubmit = e => {
    e.preventDefault();
    cred = { u: $('u').value, p: $('p').value };
    $('err').textContent = '';
    connect(() => ws.send(JSON.stringify({ t: 'login', u: cred.u, p: cred.p })));
  };
  const send = o => ws.readyState === 1 && ws.send(JSON.stringify(o));
  setInterval(() => { if (me !== null) send({ t: 'ping' }); }, 25000); // Render uyumasın diye

  function handle(m) {
    if (m.t === 'loginfail') { $('err').textContent = m.text; cred = null; me = null; return; }
    if (m.t === 'loginok') { me = m.seat; $('login').style.display = 'none'; $('game').style.display = 'grid'; return; }
    if (m.t === 'kicked') { me = null; toast('Başka yerden giriş yapıldı.'); setTimeout(() => location.reload(), 1200); return; }
    if (m.t === 'msg') { toast(m.text); return; }
    if (m.t === 'state') { S = m; render(); }
  }

  /* ---- ıstaka ---- */
  function saveRack() { try { localStorage.setItem('okeyRack' + me, JSON.stringify({ gid: slotGid, slots })); } catch (e) {} }
  function reconcile() {
    if (!S.hand) return;
    if (slotGid !== S.gid) {
      slotGid = S.gid; slots = Array(SLOTS).fill(null);
      try { const r = JSON.parse(localStorage.getItem('okeyRack' + me) || 'null'); if (r && r.gid === S.gid) slots = r.slots; } catch (e) {}
    }
    const ids = new Set(S.hand.map(t => t.id));
    slots = slots.map(x => (x !== null && ids.has(x) ? x : null));
    const present = new Set(slots.filter(x => x !== null));
    let fresh = S.hand.filter(t => !present.has(t.id));
    if (fresh.length >= 13) fresh = C.sortTiles(fresh);
    for (const t of fresh) {
      let i = pendingSlot !== null && slots[pendingSlot] === null ? pendingSlot : slots.indexOf(null);
      pendingSlot = null;
      if (i < 0) i = 0;
      slots[i] = t.id;
    }
    saveRack();
  }
  function applyLayout(res) {
    const hand = Object.fromEntries(S.hand.map(t => [t.id, t]));
    const out = Array(SLOTS).fill(null), rowLen = ROW;
    let pos = 0;
    const placed = new Set();
    for (const g of res.groups) {
      const rowEnd = (Math.floor(pos / rowLen) + 1) * rowLen;
      if (pos + g.length > rowEnd) pos = rowEnd;
      for (const t of g) { if (pos < SLOTS) { out[pos++] = t.id; placed.add(t.id); } }
      pos++;
      if (pos % rowLen === 0 && pos < SLOTS) { /* satır başı */ }
    }
    for (const t of res.rest) { if (pos < SLOTS) { out[pos++] = t.id; placed.add(t.id); } }
    for (const t of S.hand) if (!placed.has(t.id)) { const i = out.indexOf(null); if (i >= 0) out[i] = t.id; }
    slots = out; saveRack(); renderRack();
  }
  $('btnSeri').onclick = () => S && S.hand && applyLayout(C.arrangeSeri(S.hand, S.okey));
  $('btnCift').onclick = () => S && S.hand && applyLayout(C.arrangeCift(S.hand, S.okey));

  /* ---- çizim ---- */
  function tileEl(t, okey) {
    const d = document.createElement('div');
    d.className = 'tile';
    if (t.fake) { d.classList.add('fake'); d.innerHTML = '<b>✦</b><small>SAHTE</small>'; }
    else {
      d.style.color = COL[t.c];
      d.innerHTML = '<b>' + t.n + '</b><span>●</span>';
      if (okey && C.isJoker(t, okey)) d.classList.add('okey');
    }
    return d;
  }
  function renderRack() {
    const rack = $('rack');
    rack.innerHTML = '';
    const byId = Object.fromEntries((S.hand || []).map(t => [t.id, t]));
    slots.forEach((id, i) => {
      const s = document.createElement('div');
      s.className = 'slot';
      s.dataset.i = i;
      if (id !== null && byId[id]) {
        const el = tileEl(byId[id], S.okey);
        if (S.lastDrawn && S.lastDrawn.seat === me && S.lastDrawn.id === id && S.turn === me && S.hasDrawn) el.classList.add('fresh');
        el.onpointerdown = e => startPointer(e, { src: 'rack', id, from: i }, el);
        s.appendChild(el);
      }
      rack.appendChild(s);
    });
  }
  function dropOnSlot(i) {
    if (!drag) return;
    if (drag.src === 'rack') {
      const a = drag.from, b = i;
      if (a === b) return;
      [slots[a], slots[b]] = [slots[b], slots[a]];
      saveRack(); renderRack();
    } else if (drag.src === 'side') {
      if (!canDraw()) return toast('Şu an taş alamazsın.');
      pendingSlot = slots[i] === null ? i : null;
      send({ t: 'draw', from: 'side' });
    }
    drag = null;
  }

  const rel = seat => (seat - me + 4) % 4; // 0 alt, 1 sağ, 2 üst, 3 sol
  const seatAt = r => (me + r) % 4;
  const myTurn = () => S && S.phase === 'playing' && S.turn === me;
  const canDraw = () => myTurn() && !S.hasDrawn;
  const canDiscard = () => myTurn() && S.hasDrawn;

  function seatBox(el, seat) {
    el.className = 'seatbox' + (S.turn === seat && S.phase === 'playing' ? ' turn' : '');
    const partner = seat % 2 === me % 2;
    el.innerHTML = '<div class="nm">' + S.names[seat] + (S.dealer === seat ? ' ·  eli dağıttı' : '') + '</div><div class="tm">' + (partner ? 'eşin' : 'rakip') + ' · ' + S.counts[seat] + ' taş' + (S.online[seat] ? '' : ' · çevrimdışı') + '</div>';
    const b = document.createElement('div'); b.className = 'backs';
    for (let i = 0; i < S.counts[seat]; i++) b.appendChild(document.createElement('i'));
    el.appendChild(b);
  }
  function dz(el, seat, label) {
    el.innerHTML = '';
    const t = S.discards[seat];
    if (t) {
      const te = tileEl(t, S.okey);
      el.appendChild(te);
      if (seat === seatAt(3)) {
        const live = canDraw();
        el.classList.toggle('live', live);
        if (live) te.onpointerdown = e => startPointer(e, { src: 'side' }, te);
      }
    } else { el.insertAdjacentHTML('beforeend', '<small>' + label + '</small>'); }
  }

  function render() {
    if (!S) return;
    $('wait').style.display = S.phase === 'waiting' ? 'grid' : 'none';
    if (S.phase === 'waiting') return;
    reconcile();
    seatBox($('seatTop'), seatAt(2)); seatBox($('seatLeft'), seatAt(3)); seatBox($('seatRight'), seatAt(1));
    ['dzTop', 'dzLeft', 'dzRight'].forEach((id, k) => $(id).classList.remove('live'));
    dz($('dzTop'), seatAt(2), S.names[seatAt(2)]); dz($('dzLeft'), seatAt(3), S.names[seatAt(3)]); dz($('dzRight'), seatAt(1), S.names[seatAt(1)]);
    // alt (benim) at alanı
    $('dzMe').classList.toggle('live', canDiscard());
    const mine = S.discards[me];
    $('dzMe').innerHTML = mine ? '' : 'At<small>taşı buraya sürükle</small>';
    if (mine) $('dzMe').appendChild(tileEl(mine, S.okey));
    $('finish').classList.toggle('live', canDiscard() || canDraw());
    $('deck').classList.toggle('live', canDraw());
    $('deckN').textContent = S.deckCount;
    $('gos').innerHTML = '';
    const gl = document.createElement('div'); gl.textContent = 'Gösterge'; $('gos').appendChild(gl);
    const g = tileEl(S.gosterge, null); g.style.setProperty('--tw', '34px'); g.style.setProperty('--th', '48px'); $('gos').appendChild(g);
    const okeyName = ['sarı', 'mavi', 'siyah', 'kırmızı'][S.okey.c] + ' ' + S.okey.n;
    $('okeyLbl').textContent = 'Okey: ' + okeyName;
    // durum
    let st;
    if (S.phase === 'over') st = S.over.text;
    else if (myTurn()) st = S.hasDrawn ? 'Sıra sende: bir taş at ya da bitir' : 'Sıra sende: ortadan çek ya da soldan al';
    else st = 'Sıra: ' + S.names[S.turn];
    $('status').textContent = st;
    $('scoreboard').textContent = S.teamNames[0] + ' ' + S.scores[0] + '  –  ' + S.scores[1] + ' ' + S.teamNames[1];
    $('log').innerHTML = S.log.slice().reverse().join('<br>');
    renderRack();
    overlay();
  }

  function overlay() {
    const o = $('overlay');
    if (S.phase !== 'over') { o.style.display = 'none'; return; }
    let h = '<h2>' + S.over.text + '</h2>';
    if (S.over.hand) {
      h += '<div>Bitiren eli (' + (S.over.type === 'cift' ? 'çift' : 'seri') + '):</div><div class="hand">';
      const okey = S.okey;
      S.over.hand.forEach(g => { h += '<div class="grp">' + g.map(t => tileEl(t, okey).outerHTML).join('') + '</div>'; });
      h += '</div><div>Atılan son taş:</div><div class="hand"><div class="grp fin">' + tileEl(S.over.finishTile, okey).outerHTML + '</div></div>';
    }
    h += '<button id="again">Yeni el</button>';
    $('obox').innerHTML = h;
    o.style.display = 'grid';
    $('again').onclick = () => send({ t: 'newgame' });
  }

  /* ---- etkileşim ---- */
  $('deck').onclick = () => { if (canDraw()) send({ t: 'draw', from: 'deck' }); else if (S && S.phase === 'playing') toast(myTurn() ? 'Önce bir taş atmalısın.' : 'Sıra sende değil.'); };
  function dropDiscard() {
    if (!drag || drag.src !== 'rack') return;
    if (!canDiscard()) return toast(myTurn() ? 'Önce taş çekmelisin.' : 'Sıra sende değil.');
    send({ t: 'discard', id: drag.id });
  }
  function dropFinish() {
    if (!drag) return;
    if (drag.src === 'rack') {
      if (!canDiscard()) return toast('Bitirmek için önce taş çekmelisin.');
      send({ t: 'finish', id: drag.id });
    } else if (drag.src === 'side') send({ t: 'finishSide' }); // yandaki taşla bitiyorsa otomatik bitirir
  }

  /* ---- sürükle-bırak (fare + dokunmatik, pointer events) ---- */
  let pdown = null, ghost = null;
  function startPointer(e, info, el) {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    pdown = { info, el, x: e.clientX, y: e.clientY, moved: false };
  }
  function clearOver() { document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); }
  function targetAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest('.slot, #dzMe, #finish'); }
  document.addEventListener('pointermove', e => {
    if (!pdown) return;
    if (!pdown.moved) {
      if (Math.hypot(e.clientX - pdown.x, e.clientY - pdown.y) < 6) return;
      pdown.moved = true; drag = pdown.info;
      ghost = pdown.el.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost);
      pdown.el.classList.add('dragging');
    }
    ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    clearOver();
    const t = targetAt(e.clientX, e.clientY);
    if (t) t.classList.add('over');
  });
  function endPointer(e, cancelled) {
    if (!pdown) return;
    const p = pdown; pdown = null;
    if (!p.moved) { if (!cancelled && p.info.src === 'side') send({ t: 'draw', from: 'side' }); return; }
    if (ghost) { ghost.remove(); ghost = null; }
    clearOver();
    p.el.classList.remove('dragging');
    const t = cancelled ? null : targetAt(e.clientX, e.clientY);
    if (t) {
      if (t.classList.contains('slot')) dropOnSlot(+t.dataset.i);
      else if (t.id === 'dzMe') dropDiscard();
      else if (t.id === 'finish') dropFinish();
    }
    drag = null;
  }
  document.addEventListener('pointerup', e => endPointer(e, false));
  document.addEventListener('pointercancel', e => endPointer(e, true));

  /* ---- ekrana sığdırma (telefon: 3 satırlı ıstaka) ---- */
  function fit() {
    const w = innerWidth, narrow = w < 700;
    ROW = narrow ? 10 : 15;
    const tw = narrow ? Math.max(22, Math.floor((w - 70) / ROW) - 6) : (w < 1100 ? 38 : 46);
    const r = document.documentElement.style;
    r.setProperty('--tw', tw + 'px'); r.setProperty('--th', Math.round(tw * 1.4) + 'px'); r.setProperty('--cols', ROW);
    document.body.classList.toggle('narrow', narrow);
  }
  addEventListener('resize', () => { fit(); if (S && S.hand) render(); });
  fit();

  let tt;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => (t.style.display = 'none'), 2200); }
})();
</script>
</body>
